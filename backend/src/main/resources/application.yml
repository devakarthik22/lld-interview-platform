server:
  port: 8080

spring:
  application:
    name: lld-interview-platform
  datasource:
    url: jdbc:h2:mem:llddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
  cache:
    type: simple
  ai:
    openai:
      api-key: ${GEMINI_API_KEY:your-gemini-api-key-here}
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      chat:
        options:
          model: models/gemini-3.1-flash-lite
          temperature: 0.7
          max-tokens: 4096
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 15s
        max-interval: 45s
        multiplier: 2.0
      on-client-errors: false

# CORS
cors:
  allowed-origins: http://localhost:4200

logging:
  level:
    com.lld: DEBUG
    org.springframework.web: INFO
