server:
  port: 8080

spring:
  application:
    name: lld-interview-platform
  datasource:
    url: jdbc:h2:mem:llddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
  cache:
    type: simple

# Google Gemini
gemini:
  api:
    key: ${GEMINI_API_KEY:your-gemini-api-key-here}
    base-url: https://generativelanguage.googleapis.com/v1beta
    model: gemini-2.5-flash-lite
    timeout: 30

# CORS
cors:
  allowed-origins: http://localhost:4200

logging:
  level:
    com.lld: DEBUG
    org.springframework.web: INFO
